name: thaman_app
description: "ثـمـــن مــوتــرك — free used-car valuation in Qatar."
publish_to: 'none'

# version is set by CI from the run number, so two builds can never
# collide in Play Console. The value here is only the local default.
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Deliberately few plugins. Every extra native dependency is another
  # thing that can break a release build or hold up a store review, and
  # this app needs very little that Flutter does not already have.
  http: ^1.2.0             # the only network client we need
  image_picker: ^1.1.0     # camera + gallery, resizes before we ever hold the bytes
  shared_preferences: ^2.2.0  # cached config and the saved draft
  url_launcher: ^6.2.0     # terms, privacy, phone, Instagram

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Build-time only — they write the launcher icons and the launch screen,
  # and neither is shipped as a dependency of the app itself.
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

# The screen between tapping the icon and the app being ready to draw.
#
# Flutter does not give you one: without this the phone shows a plain white
# rectangle for a second or two, and on a dark-themed app that reads as a
# flash of nothing gone wrong. Every serious app sets this — it is simply a
# step that had never been added here, and `assets/brand/logo-splash.png` was
# sitting in the repo unused.
#
# This runs at build time and writes the real Android and iOS launch screens,
# so what appears is the TMK mark on the same near-black the app itself opens
# on — the join between the launch screen and تصميم اليوم is invisible.
flutter_native_splash:
  color: "#131013"
  image: assets/brand/logo-splash.png
  android: true
  ios: true
  web: false

  # Android 12 changed the rules: the system draws the launch screen itself and
  # masks the artwork to a circle — 1152 px of drawable, only the middle 768 px
  # certain to be visible. The wide wordmark loses both ends that way, so this
  # one is the same artwork already centred in a square with the margin built
  # in. The background matches the window, so the circle itself never shows.
  #
  # It lives under tool/ rather than assets/ on purpose: it is read once at
  # build time and would otherwise be shipped inside the APK for nothing.
  android_12:
    color: "#131013"
    image: tool/splash/logo-splash-android12.png
    icon_background_color: "#131013"

# The icon, generated for every Android density and every iOS size from one
# picture, so there is no folder of hand-cut PNGs to keep in step.
#
# Android 8 and newer draw the icon in whatever shape the launcher wants —
# circle, squircle, teardrop — and crop whatever falls outside. That is why the
# adaptive icon is built from the *maskable* logo, which already carries the
# safe margin, over the Qatar maroon. Using the plain logo here would clip the
# roof of the car on a round launcher.
flutter_launcher_icons:
  image_path: "assets/brand/icon-512.png"
  android: "ic_launcher"
  adaptive_icon_background: "#8A1538"
  adaptive_icon_foreground: "assets/brand/maskable-512.png"
  ios: true
  # The App Store rejects an icon with transparency, without explaining that
  # this is what it means.
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    # Two families, exactly as the website ships them. Arabic set in Naskh,
    # English set in Poppins — Latin text in an Arabic naskh face reads thin
    # and slightly foreign, which is what v1 did to every English screen.
    # Each is the other's fallback, so a stray word in either script still
    # renders in a face designed for it.
    - family: Naskh
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
