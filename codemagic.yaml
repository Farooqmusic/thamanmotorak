# ============================================================
#  Codemagic — builds for ثـمـــن مــوتــرك
#
#  Two workflows: Android first, iOS when the Apple key is in.
#
#  Both run on macOS M2, and that is deliberate: Codemagic's free
#  500 minutes a month are macOS-only, so an Android build on a
#  Linux instance would be billed while the same build on macOS is
#  free. macOS builds Android perfectly well.
#
#  Nothing here depends on anyone's laptop. android/ and ios/ are
#  generated by app/tool/bootstrap.sh from whichever Flutter is
#  building, so a Flutter upgrade can never leave a stale Gradle
#  file behind to fail on.
# ============================================================

definitions:
  # The version everything is built with. Change it in one place.
  flutter_version: &flutter_version 3.32.0

  scripts:
    - &generate_platform_folders
      name: Generate android/ and ios/, apply our settings
      script: |
        cd app
        chmod +x tool/bootstrap.sh
        ./tool/bootstrap.sh

    - &pub_get
      name: Dependencies
      script: cd app && flutter pub get

    - &analyze
      name: Analyse
      # Forty seconds here saves a six-minute build that was going to
      # fail on a typo anyway.
      script: cd app && flutter analyze --no-fatal-infos

    - &test
      name: Test
      script: cd app && flutter test

workflows:
  # ----------------------------------------------------------------
  #  ANDROID — the one to run first
  # ----------------------------------------------------------------
  android:
    name: Android — APK and AAB
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      flutter: *flutter_version
      java: 17
      groups:
        # Create this group in Codemagic → Environment variables and put
        # the four ANDROID_* values in it. Until you do, the build still
        # runs and still produces an installable APK — debug-signed,
        # which is fine for your own phone but not accepted by Play.
        - android_signing
      vars:
        PACKAGE_NAME: com.thamanmotorak.app

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      # Only rebuild when the app or this file changed — the website's
      # PHP has nothing to do with the APK.
      cancel_previous_builds: true

    scripts:
      - *generate_platform_folders

      - name: Signing key
        script: |
          cd app
          if [ -z "${CM_KEYSTORE:-}" ]; then
            echo "No keystore in the environment — this build will be debug-signed."
            echo "Fine for testing on your own phone; Play will refuse it."
            exit 0
          fi
          echo "$CM_KEYSTORE" | base64 --decode > android/upload.jks
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=upload.jks
          EOF
          echo "Release signing configured."

      - *pub_get
      - *analyze
      - *test

      # Play Console refuses an upload whose build number is not higher
      # than the last one. BUILD_NUMBER rises on its own, so this is one
      # less thing to remember at the wrong moment.
      - name: Build APK
        script: |
          cd app
          flutter build apk --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --dart-define=APP_VERSION=1.0.$BUILD_NUMBER

      - name: Build App Bundle
        script: |
          cd app
          flutter build appbundle --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --dart-define=APP_VERSION=1.0.$BUILD_NUMBER

      - name: Give the files names a human can read
        script: |
          cd app
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             "out/thamanmotorak-1.0.$BUILD_NUMBER.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "out/thamanmotorak-1.0.$BUILD_NUMBER.aab" || true
          ls -lh out

    artifacts:
      - app/out/*
      - app/build/**/outputs/**/mapping.txt
      - app/flutter_drive.log

    publishing:
      email:
        recipients:
          - 8my77kyffn@privaterelay.appleid.com
        notify:
          success: true
          failure: true

      # Uncomment once the closed test exists in Play Console and the
      # service-account JSON is in Codemagic. Until then, upload the
      # .aab by hand — the first upload has to be manual anyway,
      # because the track does not exist yet.
      #
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: false

  # ----------------------------------------------------------------
  #  iOS — after Android is on a phone and working
  # ----------------------------------------------------------------
  ios:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      groups:
        # Needs an App Store Connect API key (Users and Access → Keys).
        # Codemagic then handles certificates and profiles itself, which
        # is the only sane way to do Apple signing on a build machine.
        - appstore_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.thamanmotorak.app

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - *generate_platform_folders
      - *pub_get
      - *analyze
      - *test

      - name: Set the bundle id and register signing
        script: |
          cd app
          xcode-project use-profiles

      - name: Build ipa
        script: |
          cd app
          flutter build ipa --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --dart-define=APP_VERSION=1.0.$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - 8my77kyffn@privaterelay.appleid.com
        notify:
          success: true
          failure: true

      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
