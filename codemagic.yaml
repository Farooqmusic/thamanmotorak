# ============================================================
#  Codemagic — builds for ثـمـــن مــوتــرك
#
#  Two workflows: Android first, iOS when the Apple key is in.
#
#  Both run on macOS M2, and that is deliberate: Codemagic's free
#  500 minutes a month are macOS-only, so an Android build on a
#  Linux instance would be billed while the same build on macOS is
#  free. macOS builds Android perfectly well.
#
#  Nothing here depends on anyone's laptop. android/ and ios/ are
#  generated by app/tool/bootstrap.sh from whichever Flutter is
#  building, so a Flutter upgrade can never leave a stale Gradle
#  file behind to fail on.
# ============================================================

definitions:
  # The version everything is built with. Change it in one place.
  flutter_version: &flutter_version 3.35.7

  scripts:
    - &generate_platform_folders
      name: Generate android/ and ios/, apply our settings
      script: |
        cd app
        chmod +x tool/bootstrap.sh
        ./tool/bootstrap.sh

    - &pub_get
      name: Dependencies
      script: cd app && flutter pub get

    - &icons
      name: Launcher icons
      # Must run after `pub get` (it is a pub package) and after the platform
      # folders exist (it writes into them). Both are true by the time this runs.
      script: cd app && dart run flutter_launcher_icons

    - &splash
      name: Launch screen
      # Same two conditions as the icons: after `pub get`, because it is a pub
      # package, and after the platform folders exist, because it writes the
      # drawables and the Android 12 style into them. Skipping this is what
      # left a white rectangle between the icon and the app.
      script: cd app && dart run flutter_native_splash:create

    - &splash_android
      name: Launch screen — Android, written by us
      # Runs AFTER the generator on purpose, so that what we decided wins.
      #
      # Three builds shipped with the generator configured correctly and three
      # builds showed nothing branded on launch. This step writes the drawable,
      # the colour and the four style files itself, prints every one of them,
      # and fails the build if any is missing. See app/tool/splash_android.py
      # for what Android 12 changed and why the window background matters as
      # much as the system splash does.
      script: cd app && python3 tool/splash_android.py

    - &analyze
      name: Analyse
      # Forty seconds here saves a six-minute build that was going to
      # fail on a typo anyway.
      script: cd app && flutter analyze --no-fatal-infos

    - &test
      name: Test
      script: cd app && flutter test

workflows:
  # ----------------------------------------------------------------
  #  ANDROID — the one to run first
  # ----------------------------------------------------------------
  android:
    name: Android — APK and AAB
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      flutter: *flutter_version
      java: 17
      groups:
        # Create this group in Codemagic → Environment variables and put
        # the four ANDROID_* values in it. Until you do, the build still
        # runs and still produces an installable APK — debug-signed,
        # which is fine for your own phone but not accepted by Play.
        - android_signing
      vars:
        PACKAGE_NAME: com.thamanmotorak.app

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      # Only rebuild when the app or this file changed — the website's
      # PHP has nothing to do with the APK.
      cancel_previous_builds: true

    scripts:
      - *generate_platform_folders

      - name: Signing key
        script: |
          cd app
          if [ -z "${CM_KEYSTORE:-}" ]; then
            echo "No keystore in the environment — this build will be debug-signed."
            echo "Fine for testing on your own phone; Play will refuse it."
            exit 0
          fi
          echo "$CM_KEYSTORE" | base64 --decode > android/upload.jks
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=upload.jks
          EOF
          echo "Release signing configured."

      - *pub_get
      - *icons
      # No *splash here. The generator is kept for iOS, where it writes the
      # storyboard and does its job; on Android it wrote a launch screen that
      # three builds proved nobody ever saw, and everything it leaves behind —
      # a 1152 px PNG in five density buckets, an orphaned launch_background,
      # and a second writer for values/colors.xml that flutter_launcher_icons
      # also owns — is dead weight inside the APK at best and a resource clash
      # at worst. splash_android.py writes the whole Android side itself.
      - *splash_android
      - *analyze
      - *test

      # Play Console refuses an upload whose build number is not higher
      # than the last one. BUILD_NUMBER rises on its own, so this is one
      # less thing to remember at the wrong moment.
      - name: Build APK
        script: |
          cd app
          flutter build apk --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --dart-define=APP_VERSION=1.0.$BUILD_NUMBER

      # Three builds were installed on a real phone before anybody could say
      # whether the launch screen was in them. This prints the answer in the
      # log, so the fourth one is checked here and not in Doha.
      - name: Prove the launch screen is in the APK
        script: |
          cd app
          RES=android/app/src/main/res
          echo "--- the files that went into this build ---"
          find "$RES" -name 'tmk_*' -o -name 'styles.xml' | sort
          echo
          echo "--- values/styles.xml ---"
          cat "$RES/values/styles.xml"
          echo
          echo "--- values-v31/styles.xml ---"
          cat "$RES/values-v31/styles.xml"

          # Hard checks. The splash itself is Flutter's now — what the native
          # side must not get wrong is the window colour, and the one line that
          # was wrong for four builds is NormalTheme's.
          for f in "$RES/values/tmk_splash.xml" \
                   "$RES/values/styles.xml" "$RES/values-night/styles.xml" \
                   "$RES/values-v31/styles.xml" "$RES/values-night-v31/styles.xml" \
                   "$RES/drawable-xxxhdpi/tmk_splash_icon.png"; do
            [ -s "$f" ] || { echo "MISSING: $f"; exit 1; }
          done
          # Two matches per file = LaunchTheme AND NormalTheme. One match means
          # the white flash is back.
          for f in "$RES/values/styles.xml" "$RES/values-night/styles.xml" \
                   "$RES/values-v31/styles.xml" "$RES/values-night-v31/styles.xml"; do
            [ "$(grep -c 'tmk_splash_bg' "$f")" -ge 2 ] \
              || { echo "$f does not brand BOTH themes — white flash"; exit 1; }
          done
          grep -q 'tmk_splash_icon' "$RES/values-v31/styles.xml" \
            || { echo "the Android 12 splash icon is not referenced"; exit 1; }

          # And the artwork Flutter animates has to be in the bundle.
          unzip -l build/app/outputs/flutter-apk/app-release.apk \
            | grep 'assets/brand/splash-mark.png' \
            || { echo "splash-mark.png is not in the APK"; exit 1; }
          echo
          echo "Launch screen: window branded in all four themes, mark bundled."

      - name: Build App Bundle
        script: |
          cd app
          flutter build appbundle --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --dart-define=APP_VERSION=1.0.$BUILD_NUMBER

      - name: Give the files names a human can read
        script: |
          cd app
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk \
             "out/thamanmotorak-1.0.$BUILD_NUMBER.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "out/thamanmotorak-1.0.$BUILD_NUMBER.aab" || true
          ls -lh out

    artifacts:
      - app/out/*
      - app/build/**/outputs/**/mapping.txt
      - app/flutter_drive.log

    publishing:
      email:
        recipients:
          - 8my77kyffn@privaterelay.appleid.com
        notify:
          success: true
          failure: true

      # Uncomment once the closed test exists in Play Console and the
      # service-account JSON is in Codemagic. Until then, upload the
      # .aab by hand — the first upload has to be manual anyway,
      # because the track does not exist yet.
      #
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: false


  # ----------------------------------------------------------------
  #  iOS — AD HOC. Straight onto Farooq's own iPhones.
  #
  #  Nothing here goes to App Store Connect and nothing is reviewed
  #  by Apple. The build is signed with his own certificate for the
  #  iPhones whose UDIDs are registered in his developer account,
  #  and installs over the air from his own website.
  #
  #  Started by hand — there is deliberately no `triggering` block,
  #  so a push to main does not spend a mac minute on an iOS build
  #  nobody asked for.
  # ----------------------------------------------------------------
  ios-adhoc:
    name: iOS — ad hoc (install on your own iPhones)
    instance_type: mac_mini_m2
    max_build_duration: 60

    # The App Store Connect API key that was already in Codemagic for Farooq
    # Music. A key belongs to the Apple **account**, not to an app, and both
    # apps are on the same team — so there was no second key to make. The name
    # is what Codemagic calls it under Integrations, matched literally:
    # "Farooq Music", capitals and space included.
    #
    # `integrations` is a SIBLING of `environment`, not a child of it. Nesting
    # it inside was rejected outright — "extra fields not permitted" — which is
    # at least a validation error you get before the build rather than after.
    #
    # With it, Codemagic creates the certificate and the ad-hoc provisioning
    # profile itself. The profile covers every device registered in the Apple
    # developer account at the moment of the build — so a NEW iPhone means:
    # register its UDID first, then build again. An already-built ipa cannot
    # learn about a phone.
    integrations:
      app_store_connect: "Farooq Music"

    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.thamanmotorak.app

      vars:
        # Where the three files below will live once they are uploaded.
        # iOS refuses to install over the air from anything but HTTPS,
        # which his own site already is.
        BETA_URL: https://www.thamanmotorak.com/beta

    scripts:
      - *generate_platform_folders
      - *pub_get
      - *icons
      - *splash
      - *analyze
      - *test

      - name: Register the signing profile with Xcode
        script: cd app && xcode-project use-profiles

      - name: Build the ad hoc ipa
        script: |
          cd app
          flutter build ipa --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --dart-define=APP_VERSION=1.0.$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

      # An .ipa on its own cannot be installed by tapping it. iOS wants a
      # manifest describing it, fetched over HTTPS through an itms-services
      # link. Both are written here, already pointing at the right URLs, so
      # that installing is: upload four files, open one page on the phone.
      - name: Make the over-the-air install page
        script: |
          cd app
          mkdir -p out/beta
          cp build/ios/ipa/*.ipa out/beta/thamanmotorak.ipa
          cp assets/brand/icon-512.png out/beta/icon-512.png

          cat > out/beta/manifest.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key><string>software-package</string>
                    <key>url</key><string>$BETA_URL/thamanmotorak.ipa</string>
                  </dict>
                  <dict>
                    <key>kind</key><string>display-image</string>
                    <key>url</key><string>$BETA_URL/icon-512.png</string>
                  </dict>
                  <dict>
                    <key>kind</key><string>full-size-image</string>
                    <key>url</key><string>$BETA_URL/icon-512.png</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key><string>com.thamanmotorak.app</string>
                  <key>bundle-version</key><string>1.0.$BUILD_NUMBER</string>
                  <key>kind</key><string>software</string>
                  <key>title</key><string>Thamanmotorak</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF

          cat > out/beta/index.html <<EOF
          <!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>ثـمـــن مــوتــرك — نسخة تجريبية</title>
          <style>
            body{margin:0;min-height:100vh;display:grid;place-items:center;background:#131013;
                 color:#f2ecef;font-family:-apple-system,system-ui,sans-serif;text-align:center;padding:24px}
            .b{display:block;background:#c02a55;color:#fff;text-decoration:none;font-weight:700;
               font-size:19px;padding:17px 34px;border-radius:14px;margin:26px auto 0}
            p{color:#b6a5ac;font-size:14px;line-height:1.9;max-width:30em;margin:8px auto}
            code{color:#ff7fa3}
          </style>
          <h1>ثـمـــن مــوتــرك</h1>
          <p>النسخة التجريبية <code>1.0.$BUILD_NUMBER</code></p>
          <a class="b" href="itms-services://?action=download-manifest&amp;url=$BETA_URL/manifest.plist">تثبيت على الآيفون</a>
          <p>افتح هذه الصفحة من <b>Safari على الآيفون</b> — لن تعمل من الكمبيوتر ولا من متصفح آخر.<br>
          بعد التثبيت: الإعدادات ← عام ← إدارة VPN والأجهزة ← ثِق بالمطوّر.</p>
          <p style="direction:ltr">Open this page in <b>Safari on the iPhone</b> — it will not work on a computer or in another browser.<br>
          After installing: Settings → General → VPN &amp; Device Management → trust the developer.</p>
          </html>
          EOF

          # Hostinger serves most things correctly, but an ipa handed over as
          # text/plain simply will not install, and the failure gives no reason.
          cat > out/beta/.htaccess <<'EOF'
          AddType application/octet-stream .ipa
          AddType application/xml .plist
          EOF

          ls -lh out/beta

    artifacts:
      - app/out/beta/*
      - app/out/beta/.htaccess
      - app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - 8my77kyffn@privaterelay.appleid.com
        notify:
          success: true
          failure: true

  # ----------------------------------------------------------------
  #  iOS — after Android is on a phone and working
  # ----------------------------------------------------------------
  ios:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    # The same key the ad-hoc workflow uses — the one already set up for Farooq
    # Music. Codemagic creates the distribution certificate and the App Store
    # profile from it. Sibling of `environment`, not a child; see the note in
    # the ad-hoc workflow above.
    integrations:
      app_store_connect: "Farooq Music"

    environment:
      flutter: *flutter_version
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.thamanmotorak.app

    # Started by hand, like the ad-hoc one. It used to build on every push to
    # main, which would have meant every Android fix silently spending a second
    # mac build and pushing another number at TestFlight. iOS goes up when
    # there is something worth testers looking at.

    scripts:
      - *generate_platform_folders
      - *pub_get
      - *icons
      - *splash
      - *analyze
      - *test

      - name: Set the bundle id and register signing
        script: |
          cd app
          xcode-project use-profiles

      - name: Build ipa
        script: |
          cd app
          flutter build ipa --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER \
            --dart-define=APP_VERSION=1.0.$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - 8my77kyffn@privaterelay.appleid.com
        notify:
          success: true
          failure: true

      # Straight into TestFlight.
      #
      # `auth: integration` means the key named above, so there is nothing else
      # to configure. **Internal testers get the build with no Apple review** —
      # usually within half an hour of the build finishing, and it arrives in
      # the TestFlight app and updates itself from then on. Only *external*
      # testers go through Beta App Review.
      #
      # The app record must already exist in App Store Connect with the bundle
      # id com.thamanmotorak.app, or the upload is rejected with a message that
      # does not obviously say so.
      app_store_connect:
        auth: integration
        submit_to_testflight: true
